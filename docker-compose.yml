services:
  # Serviço de API do supervisor - o "supervisor" que futuramente vai
  # rodar a lógica do LangGraph.
  supervisor-api:
    build:
      context: ./supervisor_api 
    ports:
      - "8000:8000" 
    env_file:
      - .env
    depends_on:
      trello_mcp:
        condition: service_healthy
      docs_mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen ('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
  # Serviço do bot do TELEGRAM - o "cliente" que fala com o usuário
  # e repassa a menssagem para a API.
  telegram-bot:
    build:
      context: ./telegram_bot
    env_file:
      - .env
    depends_on:
      supervisor-api:
        # só inicia o bot depois que o healthcheck da API acima
        # reportar "healthy" - evita o ocorrido onde o bot tenta
        # falar com aum API que aidna nºao terminou de subir.
        condition: service_healthy
  
  trello_mcp:
    build:
      context: ./mcp_servers/trello_server
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 8001), timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  docs_mcp:
      build:
        context: ./mcp_servers/docs_server
      volumes:
        - "D:/Portal Conexão/AVA/docs:/app/synereduc_docs:ro"
      healthcheck:
        test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 8002), timeout=3)"]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 10s